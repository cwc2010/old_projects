<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Fluid simulation (motion enabled)</title>
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000;
      }
      #canvas { display: block; }

      /* Permission overlay */
      #permissionOverlay {
        position: fixed; inset: 0; z-index: 1000;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.6);
      }
      #permissionOverlay .panel {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #111; color: #fff;
        border: 1px solid #333; border-radius: 12px;
        padding: 16px 18px; max-width: 90vw; width: 420px; text-align: center;
      }
      #permissionOverlay button {
        background: #18a0fb; color: #fff; border: 0;
        padding: 12px 16px; border-radius: 10px; font-weight: 700;
        cursor: pointer; margin-top: 12px;
      }
      #permissionOverlay small {
        display: block; opacity: 0.8; margin-top: 10px; font-size: 12px;
      }
    </style>
  </head>
  <body>
    <!-- Motion permission overlay -->
    <div id="permissionOverlay">
      <div class="panel">
        <h3 style="margin:0 0 8px 0;">Enable motion control?</h3>
        <p style="margin:0 0 12px 0;">
          This demo can use your device’s accelerometer to tilt the fluid.
          On iOS, a tap is required to grant permission.
        </p>
        <button id="startBtn">Enable accelerometer</button>
        <small id="status">Tip: On desktop, move the mouse to control gravity.</small>
      </div>
    </div>

    <canvas id="canvas"></canvas>
    <script src="main.js"></script>
  </body>
</html>
