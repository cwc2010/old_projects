<video autoplay id=video style="display:none;width:200px;height:200px;border:1px solid #000"></video><div style=width:100%;height:100%;transform:scaleX(-1) id=fullscreen><canvas id=canvas style="max-width:100%;max-height:100%;width:100%;position:absolute;top:0;left:0;border:1px solid #000"></canvas><canvas id=canvas2 style="max-width:100%;max-height:100%;width:100%;filter:invert(1);opacity:.5;position:absolute;top:0;left:0;border:1px solid #000"></canvas></div><div style=position:fixed;top:0;left:0>Toggle front/back camera: <input id=camera type=checkbox><br>Flip Camera: <input id=flip type=checkbox checked><br>Sensitivity: <input id=gAlpha type=range max=1 min=0.025 step=0.01 value=0.25></div><script>async function init(e){video.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:e}}})}init("user");let ctx=canvas.getContext("2d"),ctx2=canvas2.getContext("2d");setInterval((()=>{canvas.width!=video.videoWidth&&(canvas.width=video.videoWidth,canvas.height=video.videoHeight,canvas2.width=canvas.width,canvas2.height=canvas.height),ctx.globalAlpha=1,ctx.drawImage(video,0,0,video.videoWidth,video.videoHeight),ctx2.globalAlpha=gAlpha.value,ctx2.drawImage(video,0,0,video.videoWidth,video.videoHeight)})),flip.addEventListener("change",(()=>{fullscreen.style.transform=`scaleX(${flip.checked?-1:1})`})),camera.addEventListener("change",(()=>{init(camera.checked?"environment":"user")}))</script>
